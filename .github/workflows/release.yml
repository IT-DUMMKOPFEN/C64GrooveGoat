name: Release assets

# Builds all platforms for a release and uploads the packages to it
# (gh release upload --clobber). Runs when a release is published in the
# GitHub UI, or by hand for an existing release tag.
# Releases published by tagged-build.yml (GITHUB_TOKEN) do not trigger it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release to build and upload to'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build all platforms
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
    permissions:
      contents: read

  upload:
    name: Upload to release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: release-assets

      - name: Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || { echo "no release for tag $TAG"; exit 1; }
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
